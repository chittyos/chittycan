name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Node 20 ships npm 10.9.x. npm trusted publishing (tokenless OIDC) needs
      # >= 11.5.1 (npm 12 requires Node >=22 and cannot install here), and this job already grants id-token: write — so the only
      # thing standing between this workflow and a credential-free publish is
      # the bundled npm being too old. Upgrading also keeps the NODE_AUTH_TOKEN
      # path below working unchanged, so whichever route is configured on the
      # npmjs side, this job can take it.
      - name: Upgrade npm for trusted publishing support
        run: |
          npm install -g npm@^11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Two supported auth routes, in preference order:
      #   1. Trusted publishing — configure CHITTYOS/chittycan + this workflow as
      #      a trusted publisher at npmjs.com. No secret exists to leak or
      #      rotate; OIDC is exchanged at publish time. NODE_AUTH_TOKEN is simply
      #      empty and unused.
      #   2. NPM_TOKEN — a granular token in the org/repo secret, used when no
      #      trusted publisher is registered.
      # Run 30600637120 failed ENEEDAUTH because neither was configured.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## ChittyCan v${{ steps.version.outputs.VERSION }}

            OpenAI-compatible AI gateway + Universal infrastructure interface

            ### Installation
            ```bash
            npm install -g chittycan
            can config
            ```

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### Quick Links
            - [Migration from OpenAI](https://github.com/${{ github.repository }}/blob/main/MIGRATION_PLAYBOOK.md)
            - [Contributing Guide](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)
            - [License Strategy](https://github.com/${{ github.repository }}/blob/main/LICENSE_STRATEGY.md)

          draft: false
          prerelease: false
