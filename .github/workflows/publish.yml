name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Node 20 ships npm 10.8.2. npm trusted publishing (tokenless OIDC) needs
      # >= 11.5.1, and npm 12 declares node ^22.22.2 || ^24.15.0 || >=26 so it
      # cannot install here at all. This job already grants id-token: write.
      #
      # NOTE: the old npm is only ONE of two blockers. A trusted publisher for
      # CHITTYOS/chittycan + this workflow must also be registered at npmjs.com;
      # without it, publishing still fails ENEEDAUTH. Upgrading also leaves the
      # NODE_AUTH_TOKEN path untouched, so either route works once configured.
      #
      # Pinned exactly: this step only ever runs during a real release, so a
      # floating range would change the publish path with no prior smoke test.
      - name: Upgrade npm for trusted publishing support
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Two supported auth routes, in preference order:
      #   1. Trusted publishing — configure CHITTYOS/chittycan + this workflow as
      #      a trusted publisher at npmjs.com. No secret exists to leak or
      #      rotate; OIDC is exchanged at publish time. NODE_AUTH_TOKEN is simply
      #      empty and unused.
      #   2. NPM_TOKEN — a granular token in the org/repo secret, used when no
      #      trusted publisher is registered.
      # Run 30600637120 failed ENEEDAUTH because neither was configured.
      # --loglevel verbose is load-bearing, not noise. npm's OIDC exchange
      # (lib/utils/oidc.js) is documented to never throw: every failure —
      # unregistered publisher, wrong workflow filename, bad repo, failed token
      # exchange — is emitted only at verbose level and then falls through to
      # the same ENEEDAUTH as "no auth configured at all". Without this flag a
      # misconfigured trusted publisher is indistinguishable from an absent one.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## ChittyCan v${{ steps.version.outputs.VERSION }}

            OpenAI-compatible AI gateway + Universal infrastructure interface

            ### Installation
            ```bash
            npm install -g chittycan
            can config
            ```

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### Quick Links
            - [Migration from OpenAI](https://github.com/${{ github.repository }}/blob/main/MIGRATION_PLAYBOOK.md)
            - [Contributing Guide](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)
            - [License Strategy](https://github.com/${{ github.repository }}/blob/main/LICENSE_STRATEGY.md)

          draft: false
          prerelease: false
