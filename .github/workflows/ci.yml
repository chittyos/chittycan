name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        # Hook-style GIT_* pointing at a repo that does not exist. The suite
        # must strip them (tests/setup-git-env.ts, issue #190); if it stops
        # doing so, every fixture's git call fails here instead of passing in
        # CI and writing into the real repo when run from a git hook.
        env:
          GIT_DIR: /nonexistent/hook-git-dir
          GIT_WORK_TREE: /nonexistent/hook-work-tree
          GIT_INDEX_FILE: /nonexistent/hook-git-dir/index

  cross-platform-smoke:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test - help
        run: node dist/index.js --help

      - name: Smoke test - version
        run: node dist/index.js --version
