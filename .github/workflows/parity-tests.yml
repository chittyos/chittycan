name: OpenAI Parity Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity-python:
    name: Python Parity Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run Python parity tests
        env:
          CHITTYCAN_TOKEN: ${{ secrets.CHITTYCAN_TOKEN }}
          OPENAI_API_BASE: https://connect.chitty.cc/v1
        run: |
          python3 tests/parity_py.py

  parity-node:
    name: Node.js Parity Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install openai

      - name: Run Node.js parity tests
        env:
          CHITTYCAN_TOKEN: ${{ secrets.CHITTYCAN_TOKEN }}
          OPENAI_API_BASE: https://connect.chitty.cc/v1
        run: |
          node tests/parity_node.js

  # continue-on-error removed. Note this makes the job report red, NOT block a
  # merge: main has no required status checks and allow_auto_merge is true, so
  # auto-merge will merge straight through a red parity-local. Making it a real
  # gate is a branch-protection change, not a workflow one. Previously the job
  # requested model "gpt-4" from an Ollama that only pulled llama3.2:1b, so it
  # 404'd on every run since it was added while the workflow still reported
  # green — CI minutes spent for no signal at all.
  parity-local:
    name: Local Ollama Tests
    runs-on: ubuntu-latest
    # test_streaming sends no max_tokens and Ollama samples at temperature 0.8,
    # so generation length is unbounded; without a ceiling this job inherits the
    # 360-minute default.
    timeout-minutes: 20
    services:
      ollama:
        # Pinned: :latest is the one drift vector that could move the model's
        # output distribution out from under the content assertions.
        image: ollama/ollama:0.32.5
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Pull Ollama models
        run: |
          docker exec ${{ job.services.ollama.id }} ollama pull llama3.2:1b
          # llama3.2:1b is a generative model and cannot serve /v1/embeddings;
          # all-minilm is the embedding model the embeddings test needs.
          docker exec ${{ job.services.ollama.id }} ollama pull all-minilm

      # First generation loads 1.3GB of weights from cold disk. Measured at 96s
      # on a warm cache, so the previous single 120s attempt had only a 1.25x
      # margin and would fail the job outright on a slower cold runner. Retry to
      # a ~450s budget instead, and fail loudly if the model never answers.
      - name: Warm up model
        run: |
          for attempt in 1 2 3; do
            if curl -sf http://localhost:11434/api/generate \
                 -d '{"model":"llama3.2:1b","prompt":"hi","stream":false}' \
                 --max-time 150 > /dev/null; then
              echo "warm-up ok on attempt $attempt"
              exit 0
            fi
            echo "warm-up attempt $attempt timed out; retrying"
          done
          echo "FAIL: llama3.2:1b did not respond within 3 x 150s"
          exit 1

      - name: Install dependencies
        run: |
          # Unpinned once already broke this suite (see 3c70986, the openai>=1.0
          # client migration). Cap the major now that the job no longer swallows
          # its own failures.
          pip install 'openai>=1.0,<3'
          npm install --no-save 'openai@>=4 <7'

      - name: Run local tests
        env:
          OPENAI_API_KEY: dummy-key
          OPENAI_API_BASE: http://localhost:11434/v1
          PARITY_CHAT_MODEL: llama3.2:1b
          PARITY_COMPLETION_MODEL: llama3.2:1b
          PARITY_EMBEDDING_MODEL: all-minilm
        run: |
          python3 tests/parity_py.py

      # The Node harness takes the same env. Without this it is the only copy of
      # the model plumbing never executed by any job — dead code in CI.
      - name: Run local tests (Node)
        env:
          OPENAI_API_KEY: dummy-key
          OPENAI_API_BASE: http://localhost:11434/v1
          PARITY_CHAT_MODEL: llama3.2:1b
          PARITY_EMBEDDING_MODEL: all-minilm
        run: |
          node tests/parity_node.js
