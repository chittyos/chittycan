name: OpenAI Parity Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  parity-python:
    name: Python Parity Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run Python parity tests
        env:
          CHITTYCAN_TOKEN: ${{ secrets.CHITTYCAN_TOKEN }}
          OPENAI_API_BASE: https://connect.chitty.cc/v1
        run: |
          python3 tests/parity_py.py

  parity-node:
    name: Node.js Parity Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install openai

      - name: Run Node.js parity tests
        env:
          CHITTYCAN_TOKEN: ${{ secrets.CHITTYCAN_TOKEN }}
          OPENAI_API_BASE: https://connect.chitty.cc/v1
        run: |
          node tests/parity_node.js

  # No continue-on-error: this job gates. It previously carried the flag while
  # requesting model "gpt-4" from an Ollama that only had llama3.2:1b pulled, so
  # it 404'd on every run since it was added and the workflow still reported
  # green — a check that cost CI minutes and delivered no signal.
  parity-local:
    name: Local Ollama Tests
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull Ollama models
        run: |
          docker exec ${{ job.services.ollama.id }} ollama pull llama3.2:1b
          # llama3.2:1b is a generative model and cannot serve /v1/embeddings;
          # all-minilm is the embedding model the embeddings test needs.
          docker exec ${{ job.services.ollama.id }} ollama pull all-minilm

      - name: Warm up model
        run: |
          curl -sf http://localhost:11434/api/generate \
            -d '{"model":"llama3.2:1b","prompt":"hi","stream":false}' \
            --max-time 120 > /dev/null

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run local tests
        env:
          OPENAI_API_KEY: dummy-key
          OPENAI_API_BASE: http://localhost:11434/v1
          PARITY_CHAT_MODEL: llama3.2:1b
          PARITY_COMPLETION_MODEL: llama3.2:1b
          PARITY_EMBEDDING_MODEL: all-minilm
        run: |
          python3 tests/parity_py.py
