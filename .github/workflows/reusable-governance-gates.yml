name: Reusable Governance Gates

on:
  workflow_call:
    inputs:
      run_dependency_audit:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  workflow-secret-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Workflow Secret Allowlist
        shell: bash
        run: |
          set -euo pipefail
          secrets_in_use="$(grep -RhoE '\$\{\{\s*secrets(\.[A-Za-z_][A-Za-z0-9_]*|\['"'"'\"[A-Za-z_][A-Za-z0-9_]*'"'"'\"\])\s*\}\}' .github/workflows \
            | sed -E "s/.*secrets[.\['\"]([A-Za-z_][A-Za-z0-9_]*).*/\1/" \
            | sort -u || true)"

          if [[ -z "${secrets_in_use}" ]]; then
            echo "No workflow secrets in use."
            exit 0
          fi

          if [[ ! -f .github/allowed-workflow-secrets.txt ]]; then
            echo "Missing .github/allowed-workflow-secrets.txt"
            exit 1
          fi

          disallowed=0
          while IFS= read -r secret_name; do
            [[ -z "${secret_name}" ]] && continue
            if ! grep -qx "${secret_name}" .github/allowed-workflow-secrets.txt; then
              echo "Disallowed workflow secret reference: ${secret_name}"
              disallowed=1
            fi
          done <<< "${secrets_in_use}"

          if [[ "${disallowed}" -ne 0 ]]; then
            echo "Workflow secret policy check failed."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GL_VERSION="8.30.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan Git History
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --log-opts="--all" --exit-code 1

  dependency-audit:
    if: ${{ inputs.run_dependency_audit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect lockfile
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: ${{ steps.lockfile.outputs.present == 'true' }}
        with:
          node-version: "20"
          cache: npm
      - name: Install
        if: ${{ steps.lockfile.outputs.present == 'true' }}
        run: npm ci
      - name: Dependency Audit (High+)
        if: ${{ steps.lockfile.outputs.present == 'true' }}
        run: npm audit --audit-level=high
      - name: Skip Dependency Audit (no package-lock.json)
        if: ${{ steps.lockfile.outputs.present != 'true' }}
        run: echo "No package-lock.json found; skipping dependency audit."

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # Preflight. Without this, an unregistered `hygiene` command falls through
      # to the yargs `.fail()` handler in src/index.ts, which dispatches a crash
      # payload to chittyagent-resolve and exits 1 — indistinguishable from
      # "findings found". Assert the command is registered first, and fail with
      # a distinct marker if it is not. Never skip: a skip is exactly the
      # signal-free gate this detector exists to catch.
      - name: Repo Hygiene Preflight
        shell: bash
        run: |
          set -uo pipefail
          if ! node dist/index.js --help 2>/dev/null | grep -qE '(^|[[:space:]])hygiene([[:space:]]|$)'; then
            echo "HYGIENE_DETECTOR_MISSING: \`can hygiene\` is not registered in dist/index.js."
            echo "The repo-hygiene gate cannot run. This is a build/wiring failure, not a clean repo."
            exit 2
          fi
          echo "HYGIENE_DETECTOR_PRESENT"
      # Hard gate. `can hygiene` exits 1 when a finding at/above the threshold
      # exists, 0 when clean, 2 when the detector itself failed to run. The
      # preflight above guarantees exit 1 here means findings, not a missing
      # command.
      - name: Repo Hygiene (High+)
        run: node dist/index.js hygiene . --min-severity high
      # Findings detail, only when the gate fired. Threshold matches the gate so
      # the summary cannot report low-severity noise as the cause of a high+
      # failure. There is deliberately no baseline/allowlist/suppression file: a
      # findings-suppression list is the "gate that provides no signal" this
      # detector exists to catch.
      - name: Repo Hygiene Findings
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          out="$(node dist/index.js hygiene . --min-severity high --json 2>&1)"
          status=$?
          {
            echo '### Repo hygiene findings (high+)'
            if [[ "${status}" -gt 1 ]]; then
              echo "HYGIENE_DETECTOR_FAILED (exit ${status}) — the output below is a detector error, not findings."
            fi
            echo '```'
            echo "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
