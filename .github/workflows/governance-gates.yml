name: Governance Gates

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  gates:
    uses: ./.github/workflows/reusable-governance-gates.yml
    with:
      run_dependency_audit: true
    secrets: inherit

  lockfile-present:
    name: Lockfile present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gates/dependency-audit guards every step on `package-lock.json` being
      # present and otherwise echoes and reports green. That is the correct
      # default for the shared workflow (pnpm repos have no npm lockfile), but
      # for THIS repo an absent lockfile means the audit silently stopped
      # running. Assert it here so the disappearance is red, not invisible.
      - name: Assert package-lock.json is present
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json missing - gates/dependency-audit no-ops silently without it"
            exit 1
          fi

  notify-org-control-loop:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONTROL_REPO: ${{ vars.CHITTY_GOVERNANCE_CONTROL_REPO || 'CHITTYOS/chittycommand' }}
      DISPATCH_TOKEN: ${{ secrets.CHITTY_GOVERNANCE_DISPATCH_TOKEN }}
      SOURCE_REPO: ${{ github.repository }}
      SOURCE_EVENT: ${{ github.event_name }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_PR: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Dispatch Governance Signal
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "CHITTY_GOVERNANCE_DISPATCH_TOKEN not configured; skipping dispatch."
            exit 0
          fi
          payload="$(jq -nc \
            --arg source_repo "${SOURCE_REPO}" \
            --arg source_event "${SOURCE_EVENT}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg source_pr "${SOURCE_PR}" \
            '{event_type:"governance-signal", client_payload:{source_repo:$source_repo,source_event:$source_event,source_ref:$source_ref,source_sha:$source_sha,source_pr:($source_pr|if .=="" then null else tonumber end)}}')"
          curl -fsS -X POST "https://api.github.com/repos/${CONTROL_REPO}/dispatches" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}" >/dev/null
